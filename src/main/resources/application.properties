spring.application.name=api_gateway

server.port=8080

# Eureka Server URL
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Register the gateway with Eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.cloud.config.enabled=false

# Actuator health endpoint
management.endpoints.web.exposure.include=health,info

spring.cloud.gateway.server.webmvc.routes[0].id=workflow-definition-route
spring.cloud.gateway.server.webmvc.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=api/definition/**
 
logging.level.org.springframework.cloud.gateway=DEBUG

spring.cloud.gateway.server.webmvc.routes[1].id=ai-route
spring.cloud.gateway.server.webmvc.routes[1].uri=http://localhost:8082
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/aiservice/**

spring.cloud.gateway.server.webmvc.routes[2].id=workflow-tx-route
spring.cloud.gateway.server.webmvc.routes[2].uri=http://localhost:8084
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/txservice/**

